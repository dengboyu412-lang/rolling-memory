name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The command set lives in .github/ci/ci.sh so the release
      # rehearsal runs the same stages against the exported tree.
      - name: Format check (gofmt)
        run: bash .github/ci/ci.sh fmt

      - name: Build & Vet
        run: bash .github/ci/ci.sh build

      - name: Unit & E2E tests
        run: bash .github/ci/ci.sh test

      - name: Race tests
        run: bash .github/ci/ci.sh race

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/web/package-lock.json

      - name: Admin console build & tests (when present)
        run: bash .github/ci/ci.sh admin

      - name: Cross-Compile Smoke (5 release targets)
        run: bash .github/ci/ci.sh cross
